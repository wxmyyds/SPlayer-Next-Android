apply plugin: 'com.android.application'

// rquickjs 引擎（android/js-engine）：cargo-ndk 构建多 ABI .so 到 jniLibs。
// cargo/NDK 缺失时跳过（引擎初始化自会失败并回落 Java eapi 解析器，不影响构建）
def hasTool(String cmd) {
    try {
        def out = new ByteArrayOutputStream()
        exec { commandLine 'which', cmd; standardOutput = out; ignoreExitValue = true }
        return out.toString().trim() != ''
    } catch (Exception ignored) { return false }
}
def engineAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
tasks.register('buildJsEngine') {
    doLast {
        def cargoOk = hasTool('cargo') && hasTool('cargo-ndk')
        if (!cargoOk) {
            println '[js-engine] cargo/cargo-ndk 不可用，跳过原生构建（运行时回落 Java 解析器）'
            return
        }
        def ndkDir = System.getenv('ANDROID_NDK_HOME')
        if (ndkDir == null || !new File(ndkDir).exists()) {
            println "[js-engine] NDK 不可用，跳过原生构建（运行时回落 Java 解析器）"
            return
        }
        def outDir = layout.buildDirectory.dir('jsEngine').get().asFile
        engineAbis.each { target ->
            exec {
                workingDir '../js-engine'
                commandLine 'cargo', 'ndk', '--platform', '23', '-t', target, '-o',
                        '../app/src/main/jniLibs', '--', 'build', '--release'
                environment 'ANDROID_NDK_HOME', ndkDir
                environment 'CARGO_TARGET_DIR', outDir
            }
        }
    }
}
// 引擎 bundle（esbuild）：assets/engine/bundle.js
tasks.register('buildEngineBundle', Exec) {
    workingDir rootProject.projectDir.getParent()
    commandLine 'pnpm', 'build:engine'
}
preBuild.dependsOn buildJsEngine, buildEngineBundle

android {
    namespace "com.wxmyyds.splayer.next"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion "26.3.11579264"
    defaultConfig {
        applicationId "com.wxmyyds.splayer.next"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // Media3 ExoPlayer：原生音频引擎（后台播放/均衡器/变速/频谱）
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-session:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
