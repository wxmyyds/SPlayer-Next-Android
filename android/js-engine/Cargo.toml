# 独立 workspace：脱离仓库根的桌面 napi workspace（Android 不参与桌面构建）
[workspace]

[package]
name = "js-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "js_engine"
crate-type = ["cdylib"]

[dependencies]
rquickjs = "0.9"
# Android 目标无预打包绑定：启用 bindgen 运行时生成（CI 需 libclang）
rquickjs-sys = { version = "0.9", features = ["bindgen"] }
jni = "0.21"
flate2 = "1"
base64 = "0.22"
getrandom = "0.2"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
